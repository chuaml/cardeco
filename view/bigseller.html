    <script defer src="js/jquery-3.3.1.min.js"></script>
    <!-- to print item to collect-->
    <script defer src="js/function.js"></script>



    <script>
        const app = window.app || {};
        app.orders = {};
        setTimeout(async () => {
            const items = {};
            document.querySelectorAll('table#orders-table >tbody >tr').forEach((tr) => {
                const orderNumber = tr.querySelector('td:nth-child(1)').innerText.trim();
                const sku = tr.querySelector('td:nth-child(3)').innerText.trim();
                const description = tr.querySelector('td:nth-child(4)').innerText.trim();
                const sellingPrice = parseFloat(tr.querySelector('td:nth-child(5)').innerText.replace(/[^0-9\.]+/g, ''));
                const shippingFee = parseFloat(tr.querySelector('td:nth-child(6)').innerText.replace(/[^0-9\.]+/g, ''));
                const voucher = parseFloat(tr.querySelector('td:nth-child(7)').innerText.replace(/[^0-9\.]+/g, ''));
                const storeNickName = tr.querySelector('td:nth-child(10)').innerText.trim();

                const item = {
                    item_id: sku,
                    item_name: description,
                    item_list_name: storeNickName,
                    price: sellingPrice,
                    "shipping": shippingFee,
                    quantity: 1,
                    discount: voucher
                };

                // group by orderNumber
                if (items[orderNumber] === undefined) {
                    items[orderNumber] = [item];
                } else {
                    // group by item
                    const existingItem = items[orderNumber].find(i => {
                        return i.item_id === item.item_id
                            && i.price === item.price
                            && i.shipping === item.shipping
                            && i.discount === item.discount;
                    });
                    if (existingItem !== undefined) { // same item, ++quantity
                        existingItem.quantity++;
                    }
                    else { // add item if not exist
                        items[orderNumber].push(item);
                    }
                }
            });
            app.orders.items = items;

            await new Promise(resolve => setTimeout(resolve, 0));

            let totalValue = 0.00;
            let totalShippingFee = 0.00;
            let totalDiscount = 0.00;
            let totalItemCount = 0;
            const debug = {};
            debug.accumlate = (items, orderNumber) => { };
            debug.log = _ => { };
            if (location.search.startsWith('?debug')) {
                debug.accumlate = (items, orderNumber) => {
                    totalValue += items[orderNumber].reduce((acc, item) => acc + item.price * item.quantity, 0);
                    totalDiscount += items[orderNumber].reduce((acc, item) => acc + item.discount, 0);
                    totalShippingFee += items[orderNumber].reduce((acc, item) => acc + item['shipping'], 0);
                    totalItemCount += items[orderNumber].reduce((acc, item) => acc + item.quantity, 0);
                };
                debug.log = console.log;
            }

            for (const orderNumber of Object.keys(items)) {
                // gtag purchase
                gtag('event', 'purchase', {
                    transaction_id: orderNumber,
                    affiliation: "BigSeller",
                    'seller_platform': "BigSeller",
                    value: items[orderNumber].reduce((acc, item) => acc + item.price * item.quantity, 0),
                    shipping: items[orderNumber].reduce((acc, item) => acc + item['shipping'], 0),
                    currency: "MYR",
                    items: items[orderNumber]
                });

                debug.accumlate(items, orderNumber);
            }

            debug.log({ totalValue, totalShippingFee, totalDiscount, totalItemCount });


        }, 0);
    </script>
