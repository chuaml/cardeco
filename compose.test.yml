## Disposable test stack - never touches the dev database (cardeco_dev) or its volume.
##
##   docker compose -f compose.test.yml run --rm phpunit   [phpunit args]   # PHP 8.3 == composer run tests:docker
##   docker compose -f compose.test.yml run --rm phpunit74 [phpunit args]   # PHP 7.4 == composer run tests:docker:74
##   docker compose -f compose.test.yml run --rm phpunit73 [phpunit args]   # PHP 7.3 == composer run tests:docker:73
##   docker compose -f compose.test.yml down -v                             # == composer run tests:docker:down
##
## - mysql-test : mysql:8.0.41 on tmpfs, database `cardeco_test`, seeded from the SAME files the dev
##                stack uses (db/cardeco.sql.gz + db/upgrade.sql). Fresh on every `up`.
## - phpunit*   : one service per PHP runtime, all built from the Dockerfile `dev_app` target
##                (mysqli/zip/gd/xdebug) with a different PHP_VERSION build arg:
##                  phpunit    PHP 8.3  the dev container runtime
##                  phpunit74  PHP 7.4  the staging / planned production container image
##                  phpunit73  PHP 7.3  the WAMP production floor
##                Each runs ./dev.tool/run-tests.sh which installs deps, starts Apache (for tests/Smoke) and
##                runs PHPUnit so the container exit code is the PHPUnit exit code.
##                Every runtime has its own vendor volume; the packages are identical (composer.json pins
##                config.platform.php to the production floor), only the installing PHP differs.

x-phpunit: &phpunit
  depends_on:
    mysql-test:
      condition: service_healthy
  working_dir: /var/www/html
  environment:
    IS_PRODUCTION: 0
    MYSQL_HOST: mysql-test
    MYSQL_USER: cardeco-app
    MYSQL_PASSWORD: cardeco-app
    MYSQL_DB: cardeco_test
    XDEBUG_MODE: "off"
    APP_BASE_URL: http://localhost  # Apache inside this container, used by tests/Smoke
    COMPOSER_ALLOW_SUPERUSER: 1
  # `docker compose run -e CARDECO_RUN=check|lint-syntax ...` runs the static gates instead of PHPUnit
  entrypoint: ["sh", "./dev.tool/run-tests.sh"]

services:
  mysql-test:
    image: mysql:8.0.41
    # PHP < 7.4 (mysqlnd) cannot authenticate against MySQL 8's default caching_sha2_password plugin:
    # "The server requested authentication method unknown to the client". Every PHP version can use this one.
    command: ["--default-authentication-plugin=mysql_native_password"]
    tmpfs:
      - /var/lib/mysql  # throw-away storage; re-seeded on every `up`
    environment:
      MYSQL_ROOT_PASSWORD: toor
      MYSQL_DATABASE: cardeco_test
      MYSQL_USER: cardeco-app
      MYSQL_PASSWORD: cardeco-app
    volumes:
      - ./db/cardeco.sql.gz:/docker-entrypoint-initdb.d/01-cardeco.sql.gz:ro  # same seed as dev
      - ./db/upgrade.sql:/docker-entrypoint-initdb.d/02-upgrade.sql:ro        # MyISAM -> InnoDB (needed for rollback isolation)
    healthcheck:
      # The entrypoint runs the seed on a socket-only temporary server; TCP ping only succeeds once seeding is done.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptoor --silent"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  phpunit:  # PHP 8.3 + mysqli/zip/gd, identical to the dev container
    <<: *phpunit
    build:
      dockerfile: ./Dockerfile
      target: dev_app
      args:
        PHP_VERSION: "8.3"
    volumes:
      - ./:/var/www/html
      - test_vendor_php83:/var/www/html/vendor  # keeps the host vendor/ out of the container

  phpunit74:  # PHP 7.4, the runtime of the staging / planned production image (Dockerfile default)
    <<: *phpunit
    build:
      dockerfile: ./Dockerfile
      target: dev_app
      args:
        PHP_VERSION: "7.4"
    volumes:
      - ./:/var/www/html
      - test_dependencies_php:/var/www/html/vendor

  phpunit73:  # PHP 7.3, the WAMP production floor
    <<: *phpunit
    build:
      dockerfile: ./Dockerfile
      target: dev_app
      args:
        PHP_VERSION: "7.3"
    volumes:
      - ./:/var/www/html
      - test_vendor_php73:/var/www/html/vendor

volumes:
  test_vendor_php83:
  test_dependencies_php:
  test_vendor_php73:
